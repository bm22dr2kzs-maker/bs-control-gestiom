// Storage — JSONBin (cloud, cross-device) + localStorage fallback
const JKEY = "$2a$10$N7WPX6xsFFXM03.pFWMIE.R3UaX.Z2ewfNQWSEU8lcQNvyWmQwvqW";
const BIN_ID_KEY = SK + "_bid";

function serialize(tareas) {
  return tareas.map(t => ({...t,
    inicioDate: t.inicioDate ? t.inicioDate.toISOString() : null,
    comprometidaDate: t.comprometidaDate ? t.comprometidaDate.toISOString() : null,
    entregaDate: t.entregaDate ? t.entregaDate.toISOString() : null,
  }));
}
function deserialize(tareas) {
  return tareas.map(t => ({...t,
    inicioDate: t.inicioDate ? new Date(t.inicioDate) : null,
    comprometidaDate: t.comprometidaDate ? new Date(t.comprometidaDate) : null,
    entregaDate: t.entregaDate ? new Date(t.entregaDate) : null,
  }));
}
function getBinId() { try { return localStorage.getItem(BIN_ID_KEY) || "6a0ce86a6877513b279d45a4"; } catch(e) { return "6a0ce86a6877513b279d45a4"; } }
function setBinId(id) { try { localStorage.setItem(BIN_ID_KEY, id); } catch(e) {} }

function saveData(tareas, horas, pros) {
  const body = JSON.stringify({ tareas: serialize(tareas), horas, pros, ts: new Date().toISOString() });
  try { localStorage.setItem(SK, body); } catch(e) {}
  const binId = getBinId();
  if (binId) {
    fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
      method: "PUT", headers: { "Content-Type": "application/json", "X-Master-Key": JKEY }, body
    }).catch(() => {});
  } else {
    fetch("https://api.jsonbin.io/v3/b", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Master-Key": JKEY, "X-Bin-Name": "BS_Control", "X-Bin-Private": "true" }, body
    }).then(r => r.json()).then(d => { if (d.metadata?.id) setBinId(d.metadata.id); }).catch(() => {});
  }
}
function loadData() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) { const d = JSON.parse(raw); d.tareas = deserialize(d.tareas); return d; }
  } catch(e) {}
  return null;
}
function loadCloudData(onLoaded) {
  const binId = getBinId();
  fetchBin(binId, onLoaded);
}
function fetchBin(binId, onLoaded) {
  fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
    headers: { "X-Master-Key": JKEY }
  }).then(r => r.json()).then(d => {
    if (d.record?.tareas) {
      d.record.tareas = deserialize(d.record.tareas);
      onLoaded(d.record);
    }
  }).catch(() => {});
}

function DaysLeft({date}) {
  const d = dd(date);
  if (d === null) return <span style={{color:"#475569"}}>—</span>;
  const color = d < 0 ? "#ef4444" : d < 7 ? "#f59e0b" : d < 14 ? "#eab308" : "#10b981";
  return <span style={{color, fontWeight:700}}>{d < 0 ? `${Math.abs(d)}d venc.` : `${d}d`}</span>;
}

// Vista Gantt
function ViewGantt({tareas, onEdit}) {
  const hoy = new Date();
  const gIni = new Date(2026,2,1);
  const gFin = new Date(2026,10,30);
  const total = Math.round((gFin-gIni)/86400000);
  const pct = d => d?Math.max(0,Math.min(100,Math.round((d-gIni)/86400000/total*100))):null;
  const hoyP = pct(hoy);
  const meses = [];
  let cur = new Date(gIni);
  while(cur<=gFin){meses.push(new Date(cur));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  const pros = [...new Set(tareas.map(t=>t.proyecto))];

  return (
    <div style={{overflowX:"auto"}}>
      <div style={{minWidth:860}}>
        <div style={{display:"flex",marginLeft:200,marginBottom:4}}>
          {meses.map((m,i)=>{
            const sp=pct(m);
            const nm=new Date(m.getFullYear(),m.getMonth()+1,1);
            const ep=pct(nm>gFin?gFin:nm);
            return <div key={i} style={{width:`${ep-sp}%`,fontSize:9,color:"#64748b",textTransform:"uppercase",letterSpacing:1,borderLeft:"1px solid #1e293b",paddingLeft:3,flexShrink:0}}>{m.toLocaleDateString("es-CL",{month:"short"})}</div>;
          })}
        </div>
        {pros.map(p=>(
          <div key={p} style={{marginBottom:6}}>
            <div style={{fontSize:9,color:"#6366f1",fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,padding:"5px 0 2px",borderTop:"1px solid #1e293b"}}>{p}</div>
            {tareas.filter(t=>t.proyecto===p).map(t=>{
              const sp=pct(t.inicioDate);
              const ep=pct(t.entregaDate??t.comprometidaDate);
              const cp=pct(t.comprometidaDate);
              const bw=ep!=null&&sp!=null?Math.max(0.5,ep-sp):0;
              const col=EC[t.estado];
              return (
                <div key={t.id} style={{display:"flex",alignItems:"center",height:26,marginBottom:1,cursor:"pointer"}} onClick={()=>onEdit(t)}>
                  <div style={{width:200,flexShrink:0,fontSize:10,color:"#94a3b8",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",paddingRight:6}}>
                    <span style={{color:"#e2e8f0"}}>{t.tarea}</span> <span style={{color:"#475569"}}>{t.encargado.split(" ")[0]}</span>
                  </div>
                  <div style={{flex:1,position:"relative",height:14}}>
                    <div style={{position:"absolute",inset:"50% 0",height:1,background:"#1e293b"}}/>
                    {sp!=null&&<div style={{position:"absolute",left:`${sp}%`,width:`${bw}%`,height:"100%",background:col+"55",borderRadius:3,border:`1px solid ${col}88`}}/>}
                    {cp!=null&&<div style={{position:"absolute",left:`${cp}%`,top:"50%",transform:"translate(-50%,-50%) rotate(45deg)",width:7,height:7,background:col,zIndex:2}}/>}
                    {hoyP!=null&&<div style={{position:"absolute",left:`${hoyP}%`,top:0,bottom:0,width:1.5,background:"#ef444488",zIndex:3}}/>}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
        <div style={{marginTop:12,display:"flex",gap:16,flexWrap:"wrap",fontSize:10,color:"#64748b",marginLeft:200}}>
          <span>◆ Fecha comprometida</span><span style={{color:"#ef4444"}}>│ Hoy</span>
        </div>
      </div>
    </div>
  );
}

// Vista Carga
function ViewCarga({tareas}) {
  const hoy = new Date();
  const semanas = Array.from({length:4},(_,i)=>{
    const ini=new Date(hoy);ini.setDate(hoy.getDate()+i*7);
    const fin=new Date(hoy);fin.setDate(hoy.getDate()+(i+1)*7-1);
    return {ini,fin,label:`S${i+1}`};
  });
  const datos = useMemo(()=>ARQUITECTOS.map(arq=>{
    const ts=tareas.filter(t=>t.encargado===arq);
    const hTot=ts.reduce((s,t)=>s+t.horasProg,0);
    const hEjec=ts.reduce((s,t)=>s+t.horasEjec,0);
    const crit=ts.filter(t=>{const d=dd(t.comprometidaDate);return d!==null&&d<14&&t.estado!=="Completado";});
    const h30=semanas.map(({ini,fin})=>{
      let h=0;
      ts.filter(t=>t.estado!=="Completado").forEach(t=>{
        const tI=t.inicioDate??ini,tF=t.entregaDate??t.comprometidaDate;
        if(!tF)return;
        const hp=Math.max(0,t.horasProg-t.horasEjec);if(!hp)return;
        const dur=Math.max(1,Math.round((tF-tI)/86400000));
        const oI=new Date(Math.max(tI,ini)),oF=new Date(Math.min(tF,fin));
        const od=Math.max(0,Math.round((oF-oI)/86400000)+1);
        h+=hp*(od/dur);
      });
      return Math.round(h);
    });
    return {arq,ts,hTot,hEjec,crit,h30};
  }).filter(d=>d.ts.length>0),[tareas]);

  const maxH=Math.max(...datos.flatMap(d=>d.h30),1);

  return (
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:14}}>
      {datos.map(({arq,ts,hTot,hEjec,crit,h30})=>{
        const tot30=h30.reduce((s,h)=>s+h,0);
        const bCol=tot30>120?"#ef4444":tot30>80?"#f59e0b":"#6366f1";
        return (
          <div key={arq} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:10,padding:16}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
              <div>
                <div style={{fontWeight:700,color:"#f1f5f9",fontSize:14}}>{arq}</div>
                <div style={{fontSize:11,color:"#64748b"}}>{ts.length} tareas</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:18,fontWeight:800,color:bCol}}>{tot30}h</div>
                <div style={{fontSize:9,color:"#475569"}}>próx. 30 días</div>
              </div>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:9,color:"#475569",marginBottom:5,textTransform:"uppercase",letterSpacing:0.5}}>Horas programadas próximos 30 días</div>
              <div style={{display:"flex",alignItems:"flex-end",gap:5,height:44}}>
                {h30.map((h,i)=>{
                  const hp=h/maxH;
                  const bc=h>40?"#ef4444":h>25?"#f59e0b":"#6366f1";
                  return (
                    <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
                      <div style={{fontSize:8,color:bc,fontWeight:700}}>{h>0?`${h}h`:""}</div>
                      <div style={{width:"100%",background:"#1e293b",borderRadius:"2px 2px 0 0",height:36,display:"flex",alignItems:"flex-end"}}>

// Vista Disponibilidad
function ViewDisponibilidad({tareas, horas, onUpdateHoras}) {
  const hoy = new Date();
  const diaSem = hoy.getDay()===0?6:hoy.getDay()-1;
  const lunes = new Date(hoy); lunes.setDate(hoy.getDate()-diaSem); lunes.setHours(0,0,0,0);
  const semanas = Array.from({length:8},(_,i)=>{
    const ini=new Date(lunes);ini.setDate(lunes.getDate()+i*7);
    const fin=new Date(ini);fin.setDate(ini.getDate()+6);
    return {ini,fin,label:`${ini.toLocaleDateString("es-CL",{day:"2-digit",month:"short"})}–${fin.toLocaleDateString("es-CL",{day:"2-digit",month:"short"})}`};
  });
  const datos = useMemo(()=>ARQUITECTOS.map(arq=>{
    const dis=horas[arq]??41;
    const ts=tareas.filter(t=>t.encargado===arq&&t.estado!=="Completado");
    const hSem=semanas.map(({ini,fin})=>{
      let h=0;
      ts.forEach(t=>{
        const tI=t.inicioDate??ini,tF=t.entregaDate??t.comprometidaDate;
        if(!tF)return;
        const hp=Math.max(0,t.horasProg-t.horasEjec);if(!hp)return;
        const dur=Math.max(1,Math.round((tF-tI)/86400000));
        const oI=new Date(Math.max(tI,ini)),oF=new Date(Math.min(tF,fin));
        const od=Math.max(0,Math.round((oF-oI)/86400000)+1);
        h+=hp*(od/dur);
      });
      return Math.round(h*10)/10;
    });
    return {arq,dis,ts,hSem};
  }).filter(d=>d.ts.length>0),[tareas,horas]);

  function sem(p,d){
    const r=p/d;
    if(r>1.1)return{color:"#ef4444",bg:"#ef444422",label:"Sobrecargado"};
    if(r>0.85)return{color:"#f59e0b",bg:"#f59e0b22",label:"Ajustado"};
    if(r<0.1)return{color:"#475569",bg:"#47556922",label:"Sin tareas"};
    return{color:"#10b981",bg:"#10b98122",label:"OK"};
  }

  return (
    <div>
      <div style={{display:"flex",gap:14,marginBottom:16,flexWrap:"wrap"}}>
        {[{c:"#ef4444",l:">110% — Sobrecargado"},{c:"#f59e0b",l:"85-110% — Ajustado"},{c:"#10b981",l:"<85% — OK"},{c:"#475569",l:"Sin tareas"}].map(s=>(
          <div key={s.l} style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:"#94a3b8"}}>
            <div style={{width:8,height:8,borderRadius:2,background:s.c}}/>{s.l}
          </div>
        ))}
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:860}}>
          <thead>
            <tr style={{background:"#0f172a"}}>
              <th style={{padding:"8px 12px",textAlign:"left",color:"#64748b",fontSize:9,textTransform:"uppercase",letterSpacing:1,borderBottom:"1px solid #1e293b",minWidth:150}}>Arquitecto</th>
              <th style={{padding:"8px 12px",textAlign:"center",color:"#64748b",fontSize:9,textTransform:"uppercase",letterSpacing:1,borderBottom:"1px solid #1e293b"}}>H. Disp.<br/>semana</th>
              {semanas.map((s,i)=>(
                <th key={i} style={{padding:"8px 6px",textAlign:"center",color:i===0?"#6366f1":"#64748b",fontSize:9,textTransform:"uppercase",letterSpacing:0.5,borderBottom:"1px solid #1e293b",minWidth:80,fontWeight:i===0?700:400}}>
                  {i===0&&<div style={{fontSize:7,color:"#6366f1",marginBottom:1}}>ESTA SEM.</div>}
                  {s.label}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {datos.map(({arq,dis,ts,hSem})=>(
              <tr key={arq} style={{borderBottom:"1px solid #0f172a"}}>
                <td style={{padding:"10px 12px",verticalAlign:"top"}}>
                  <div style={{fontWeight:700,color:"#f1f5f9",fontSize:12}}>{arq}</div>
                  <div style={{fontSize:9,color:"#475569",marginTop:1}}>{ts.length} tareas</div>
                  {ts.map(t=>(
                    <div key={t.id} style={{display:"flex",alignItems:"center",gap:3,fontSize:9,marginTop:2}}>
                      <div style={{width:4,height:4,borderRadius:99,background:EC[t.estado],flexShrink:0}}/>
                      <span style={{color:"#64748b",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",maxWidth:120}}>{t.proyecto} — {t.tarea}</span>
                    </div>
                  ))}
                </td>
                <td style={{padding:"10px 12px",textAlign:"center",verticalAlign:"top"}}>
                  <div style={{fontSize:15,fontWeight:800,color:"#6366f1"}}>{dis}h</div>
                  <input type="number" min={1} max={60} value={dis} onChange={e=>onUpdateHoras(arq,+e.target.value)}
                    style={{marginTop:4,width:48,background:"#1e293b",border:"1px solid #334155",borderRadius:4,padding:"2px 5px",color:"#e2e8f0",fontSize:10,textAlign:"center"}}/>
                </td>
                {hSem.map((h,i)=>{
                  const sg=sem(h,dis);
                  const p=Math.min(100,Math.round(h/dis*100));
                  return (
                    <td key={i} style={{padding:"8px 6px",textAlign:"center",verticalAlign:"top",background:i===0?"#6366f108":"transparent",borderLeft:i===0?"1px solid #6366f133":"1px solid #0f172a"}}>
                      {h>0?<>
                        <div style={{fontSize:13,fontWeight:700,color:sg.color}}>{h}h</div>
                        <div style={{fontSize:9,color:sg.color,opacity:0.8}}>{p}%</div>
                        <div style={{marginTop:3,background:"#1e293b",borderRadius:99,height:3}}>
                          <div style={{width:`${Math.min(100,p)}%`,height:"100%",background:sg.color,borderRadius:99}}/>
                        </div>
                        <div style={{marginTop:3,fontSize:8,color:sg.color,background:sg.bg,borderRadius:2,padding:"1px 3px",display:"inline-block",fontWeight:600}}>{sg.label}</div>
                      </>:<span style={{color:"#475569"}}>—</span>}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// App Principal
export default function App() {
  const [tareas, setTareasRaw] = useState(() => { const d=loadData(); return d?d.tareas:INIT_TAREAS; });
  const [pros, setPros]   = useState(() => { const d=loadData(); return d&&d.pros?d.pros:INIT_PROS; });
  const [horas, setHoras] = useState(() => { const d=loadData(); return d&&d.horas?d.horas:HORAS_DEF; });
  const [vista, setVista] = useState("proyectos");
  const [edit, setEdit]   = useState(null);
  const [ntCtx, setNtCtx] = useState(null);
  const [npOpen, setNpOpen] = useState(false);
  const [fArq, setFArq]   = useState("Todos");
  const [fEst, setFEst]   = useState("Todos");
  const [fPro, setFPro]   = useState("Todos");
  const [fMan, setFMan]   = useState("Todos");
  const [fEta, setFEta]   = useState("Todas");
  const [saved, setSaved] = useState(false);
  const [w, setW]         = useState(window.innerWidth);
  const [syncMsg, setSyncMsg]         = useState("");
  const [storageSource, setStorageSource] = useState("local");

  function forzarSync() {
    setSyncMsg("Conectando...");
    const binId = getBinId();
    fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
      headers: { "X-Master-Key": JKEY }
    }).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }).then(d => {
      if (d.record?.tareas) {
        d.record.tareas = deserialize(d.record.tareas);
        if (d.record.pros) setPros(d.record.pros);
        if (d.record.horas) setHoras(d.record.horas);
        setTareasRaw(d.record.tareas);
        setStorageSource("cloud");
        setSyncMsg("✓ Sincronizado desde la nube");
      } else {
        setSyncMsg("Sin datos en la nube aún");
      }
    }).catch(e => setSyncMsg("Error: " + e.message));
  }

  useEffect(()=>{
    const fn=()=>setW(window.innerWidth);
    window.addEventListener("resize",fn);
    loadCloudData(d => {
      if (d && d.tareas) {
        if (d.pros) setPros(d.pros);
        if (d.horas) setHoras(d.horas);
        setTareasRaw(d.tareas);
        setStorageSource("cloud");
        try { localStorage.setItem(SK, JSON.stringify({ tareas: serialize(d.tareas), horas: d.horas, pros: d.pros, ts: d.ts })); } catch(e) {}
      }
    });
    return()=>window.removeEventListener("resize",fn);
  },[]);
  const mob = w < 768;

  function persist(t2,p2,h2){ saveData(t2??tareas,h2??horas,p2??pros); setSaved(true); setTimeout(()=>setSaved(false),2000); }
  function setTs(fn){ setTareasRaw(prev=>{ const n=typeof fn==="function"?fn(prev):fn; persist(n,null,null); return n; }); }
  function setHrs(fn){ setHoras(prev=>{ const n=typeof fn==="function"?fn(prev):fn; persist(null,null,n); return n; }); }

  function addT(t){ setTs(p=>[...p,t]); setNtCtx(null); }
  function addP(f){
    const n=f.nombre.trim().toUpperCase();
    const np=[...pros,n];
    setPros(np);
    setTs(prev=>[...prev,{id:Date.now(),mandante:f.mandante,proyecto:n,jefe:f.jefe,tarea:"— Sin tareas —",encargado:f.jefe,estado:"Pendiente Inicio",horasProg:0,horasEjec:0,plazo:0,pendientes:"",inicioDate:new Date(),comprometidaDate:null,entregaDate:null,pct:0}]);
    setNpOpen(false);
    persist(null,np,null);
  }
  function saveT(upd){
    const old=edit.proyecto, nw=upd.proyecto;
    setTs(prev=>{
      const nx=prev.map(t=>t.id===upd.id?upd:t);
      if(old!==nw){
        const stays=nx.some(t=>t.proyecto===old);
        setPros(pp=>{ const np=stays?pp:[...pp.filter(x=>x!==old)]; if(!np.includes(nw))np.push(nw); persist(nx,np,null); return np; });
      }
      return nx;
    });
    setEdit(null);
  }
  function delT(id){ setTs(p=>p.filter(t=>t.id!==id)); setEdit(null); }
  function delP(p){
    const nt=tareas.filter(t=>t.proyecto!==p);
    const np=pros.filter(x=>x!==p);
    setTareasRaw(nt); setPros(np); persist(nt,np,null);
  }
  function resetData(){
    saveData(INIT_TAREAS,HORAS_DEF,INIT_PROS);
    setTareasRaw(INIT_TAREAS); setPros(INIT_PROS); setHoras(HORAS_DEF);
  }

  const mandantes = useMemo(()=>[...new Set(tareas.map(t=>t.mandante))].sort(),[tareas]);
  const etapas    = useMemo(()=>[...new Set(tareas.map(t=>t.tarea.split(" ")[0]))].sort(),[tareas]);
  const filtradas = useMemo(()=>tareas.filter(t=>{
    if(fMan!=="Todos"&&t.mandante!==fMan)return false;
    if(fArq!=="Todos"&&t.encargado!==fArq)return false;
    if(fEst!=="Todos"&&t.estado!==fEst)return false;
    if(fPro!=="Todos"&&t.proyecto!==fPro)return false;
    if(fEta!=="Todas"&&!t.tarea.startsWith(fEta))return false;
    return true;
  }),[tareas,fMan,fArq,fEst,fPro,fEta]);

  const kpis = useMemo(()=>{
    const crit=tareas.filter(t=>{const d=dd(t.comprometidaDate);return d!==null&&d<7&&t.estado!=="Completado";}).length;
    const prox=tareas.filter(t=>{const d=dd(t.comprometidaDate);return d!==null&&d>=7&&d<14&&t.estado!=="Completado";}).length;
    const venc=tareas.filter(t=>t.estado!=="Completado"&&t.comprometidaDate).map(t=>({...t,dv:dd(t.comprometidaDate)})).sort((a,b)=>a.dv-b.dv)[0]??null;
    const atras=[...new Set(tareas.filter(t=>t.estado!=="Completado").map(t=>t.proyecto))].map(p=>{const ts=tareas.filter(t=>t.proyecto===p&&t.estado!=="Completado");return{p,pct:ts.reduce((s,t)=>s+t.pct,0)/ts.length};}).sort((a,b)=>a.pct-b.pct)[0]??null;
    return{total:tareas.length,crit,prox,venc,atras};
  },[tareas]);

  const btnS = active => ({background:active?"#6366f1":"transparent",border:active?"none":"1px solid #334155",borderRadius:6,padding:mob?"5px 10px":"6px 14px",color:active?"#fff":"#94a3b8",cursor:"pointer",fontSize:mob?11:12,fontWeight:active?600:400,whiteSpace:"nowrap"});

  return (
    <div style={{minHeight:"100vh",background:"#060f1e",color:"#e2e8f0",fontFamily:"'DM Sans','Segoe UI',system-ui,sans-serif"}}>

      {/* Header */}
      <div style={{background:"#0a1628",borderBottom:"1px solid #1e293b",padding:mob?"10px 14px":"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontSize:9,color:"#6366f1",fontWeight:700,textTransform:"uppercase",letterSpacing:2}}>Badia Soffia Arquitectos</div>
          <div style={{fontSize:mob?15:19,fontWeight:800,color:"#f8fafc"}}>Control de Gestión</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          {saved&&<span style={{fontSize:9,color:"#10b981",fontWeight:600}}>✓ Guardado</span>}
          <span style={{fontSize:9,fontWeight:600,color:storageSource==="cloud"?"#10b981":"#f59e0b"}}>
            {storageSource==="cloud"?"☁ Sincronizado":"💾 Local"}
          </span>
          <button onClick={forzarSync} style={{background:"transparent",border:"1px solid #334155",borderRadius:5,padding:"4px 8px",color:"#94a3b8",cursor:"pointer",fontSize:10}}>
            ↺ Sync
          </button>
          {syncMsg&&<span style={{fontSize:9,color:syncMsg.startsWith("✓")?"#10b981":"#ef4444",fontWeight:600,maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{syncMsg}</span>}
          {!mob&&(
            <button onClick={resetData} style={{...btnS(false),fontSize:11}}>↺ Restaurar</button>
          )}
          {!mob&&<div style={{fontSize:10,color:"#475569"}}>{new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})}</div>}
        </div>
      </div>

      {/* KPIs */}
      <div style={{display:"flex",overflowX:"auto",gap:1,background:"#1e293b",borderBottom:"1px solid #1e293b",scrollbarWidth:"none"}}>
        {[
          {l:"Proyectos",v:pros.length,c:"#6366f1"},
          {l:"Tareas",v:kpis.total,c:"#94a3b8"},
          {l:"Esta semana",v:kpis.crit,c:"#ef4444"},
          {l:"2 semanas",v:kpis.prox,c:"#f59e0b"},
        ].map(k=>(
          <div key={k.l} style={{background:"#0a1628",padding:"10px 14px",textAlign:"center",flexShrink:0,minWidth:72}}>
            <div style={{fontSize:20,fontWeight:800,color:k.c}}>{k.v}</div>
            <div style={{fontSize:8,color:"#475569",textTransform:"uppercase",letterSpacing:0.5,marginTop:1}}>{k.l}</div>
          </div>
        ))}
        <div style={{background:"#0a1628",padding:"10px 14px",textAlign:"center",flexShrink:0,minWidth:mob?150:200}}>
          <div style={{fontSize:8,color:"#475569",textTransform:"uppercase",letterSpacing:0.5,marginBottom:2}}>Tarea crítica</div>
          {kpis.venc&&<div style={{fontSize:mob?10:12,fontWeight:700,color:"#ef4444",lineHeight:1.2,marginBottom:1}}>{kpis.venc.proyecto} <span style={{color:"#64748b",fontWeight:400}}>· {kpis.venc.tarea}</span></div>}
          <div style={{fontSize:9,fontWeight:800,color:"#ef4444"}}>{kpis.venc?(kpis.venc.dv<0?`${Math.abs(kpis.venc.dv)}d vencida`:`${kpis.venc.dv}d restantes`):"—"}</div>
        </div>
        <div style={{background:"#0a1628",padding:"10px 14px",textAlign:"center",flexShrink:0,minWidth:100}}>
          <div style={{fontSize:8,color:"#475569",textTransform:"uppercase",letterSpacing:0.5,marginBottom:2}}>Menor avance</div>
          <div style={{fontSize:16,fontWeight:800,color:"#f43f5e"}}>{kpis.atras?`${Math.round(kpis.atras.pct*100)}%`:"—"}</div>
          {kpis.atras&&<div style={{fontSize:8,color:"#f43f5e",fontWeight:600,marginTop:1}}>{kpis.atras.p}</div>}
        </div>
      </div>

      {/* Toolbar */}
      <div style={{background:"#0a1628",borderBottom:"1px solid #1e293b"}}>
        <div style={{display:"flex",gap:4,padding:mob?"8px 12px":"10px 18px",overflowX:"auto",scrollbarWidth:"none",alignItems:"center"}}>

            <button key={v} onClick={()=>setVista(v)} style={btnS(vista===v)}>{l}</button>
          ))}
          <div style={{flex:1}}/>
          <button onClick={()=>setNpOpen(true)} style={{background:"#6366f1",border:"none",borderRadius:6,padding:"6px 14px",color:"#fff",cursor:"pointer",fontSize:12,fontWeight:700,flexShrink:0,whiteSpace:"nowrap"}}>
            + Nuevo proyecto
          </button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:mob?"1fr 1fr":"repeat(auto-fit,minmax(130px,1fr))",gap:5,padding:mob?"0 12px 10px":"0 18px 10px"}}>
          {(vista==="proyectos"||vista==="gantt")&&(
            <select value={fMan} onChange={e=>setFMan(e.target.value)} style={{...SEL_STYLE,color:"#818cf8",borderColor:"#4338ca44"}}>
              <option value="Todos">Todos los clientes</option>
              {mandantes.map(m=><option key={m}>{m}</option>)}
            </select>
          )}
          <select value={fPro} onChange={e=>setFPro(e.target.value)} style={SEL_STYLE}>
            <option value="Todos">Todos los proyectos</option>
            {[...pros].sort().map(p=><option key={p}>{p}</option>)}
          </select>
          <select value={fEta} onChange={e=>setFEta(e.target.value)} style={SEL_STYLE}>
            <option value="Todas">Todas las etapas</option>
            {etapas.map(e=><option key={e}>{e}</option>)}
          </select>
          <select value={fArq} onChange={e=>setFArq(e.target.value)} style={SEL_STYLE}>
            <option value="Todos">Todos los arquitectos</option>
            {ARQUITECTOS.map(a=><option key={a}>{a}</option>)}
          </select>
          <select value={fEst} onChange={e=>setFEst(e.target.value)} style={SEL_STYLE}>
            <option value="Todos">Todos los estados</option>
            {ESTADOS.map(e=><option key={e}>{e}</option>)}
          </select>
        </div>
      </div>

      {/* Contenido */}
      <div style={{padding:mob?10:18}}>
        {vista==="proyectos"     &&<ViewProyectos tareas={filtradas} pros={pros.filter(p=>filtradas.some(t=>t.proyecto===p))} onEdit={setEdit} onAddTarea={setNtCtx} onDelProyecto={delP}/>}
        {vista==="gantt"         &&<ViewGantt tareas={filtradas} onEdit={setEdit}/>}
        {vista==="carga"         &&<ViewCarga tareas={filtradas}/>}
        {vista==="disponibilidad"&&<ViewDisponibilidad tareas={tareas} horas={horas} onUpdateHoras={(a,v)=>setHrs(p=>({...p,[a]:v}))}/>}
        {vista==="tabla"         &&<ViewTabla tareas={filtradas} onEdit={setEdit}/>}
      </div>

      {/* Modales */}
      {edit   &&<ModalEditar tarea={edit} onSave={saveT} onClose={()=>setEdit(null)} onDelete={delT}/>}
      {ntCtx  &&<ModalNuevaTarea proyectoCtx={ntCtx} onSave={addT} onClose={()=>setNtCtx(null)}/>}
      {npOpen &&<ModalNuevoProyecto onSave={addP} onClose={()=>setNpOpen(false)}/>}

      <style>{`*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px;}`}</style>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
